{{ define "main" }}
{{ partial "page-header.html" (dict "page" .) }}
<div class="container narrow">
  <div class="prose">{{ .Content }}</div>
  {{- with hugo.Data.settings.contact }}
  <div class="contact-grid">
    <div class="info-card">
      <h2>Per Post</h2>
      <address>{{ .name }}<br>{{ .street }}<br>{{ .city }}</address>
    </div>
    {{- with .email }}
    <div class="info-card">
      <h2>Per E-Mail</h2>
      <p><a href="mailto:{{ . }}">{{ . }}</a></p>
    </div>
    {{- end }}
  </div>
  {{- end }}
</div>
{{ end }}
