# Sveltia CMS configuration - https://github.com/sveltia/sveltia-cms
# Login: "Sign In Using Access Token" - a classic GitHub token per editor
# (scope public_repo; fine-grained tokens don't work for collaborators on
# a personal repo), see README and docs/anleitung-redaktion.md.
# No OAuth app, so no server-side helper (Cloudflare Worker) is needed.
# Locally: open /admin/ in Chrome/Edge and choose "Work with Local
# Repository" to edit the files in this folder directly.

backend:
  name: github
  repo: ne-o/zukunft-fuer-kinder
  branch: main
  # Token login only: hides "Sign In with GitHub", which would need an
  # OAuth app + server-side helper we don't run.
  auth_methods: [token]
  commit_messages:
    update: "Inhalt: {{collection}} „{{slug}}“ aktualisiert"
    uploadMedia: "Bild hochgeladen: {{path}}"

locale: de

# Translations for projects and news posts (collections with "i18n: true"):
# the English version is a second file next to the German one, Hugo style
# (x.md + x.en.md). English is optional - new entries start German only
# (initial_locales), English can be switched on per entry. Only fields with
# "i18n: true" are translated (title, text, …); everything else stays in the
# German file and the website reads it from there. Missing English text
# falls back to German on the website.
i18n:
  structure: multiple_files
  locales: [de, en]
  default_locale: de
  initial_locales: [de]
  omit_default_locale_from_file_path: true
site_url: https://www.zukunft-fuer-kinder.net
display_url: https://www.zukunft-fuer-kinder.net

# Uploaded images land in assets/ so Hugo can resize them; front matter
# stores "images/<file>", which the templates resolve via resources.Get.
media_folder: assets/images
public_folder: images

# File names of new entries: plain ASCII ("für" -> "fur"), so URLs stay clean.
slug:
  encoding: ascii
  clean_accents: true

media_libraries:
  stock_assets:
    providers: []
  default:
    config:
      max_file_size: 15000000
      # Shrink photos in the browser before they're committed - keeps the
      # repo small even when editors upload 8 MB phone photos.
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400

collections:
  - name: settings
    label: Einstellungen
    icon: settings
    editor: { preview: false }
    files:
      - name: site
        label: Website-Einstellungen
        file: data/settings.yaml
        fields:
          - label: Farbschema
            name: palette
            widget: select
            options:
              - { label: "Sonne (warmes Rot, Safran)", value: sonne }
              - { label: "Himmel (Blau, Gelb)", value: himmel }
              - { label: "Petrol (Petrol, Terrakotta, Sand)", value: petrol }
              - { label: "Wald (Grün, Orange)", value: wald }
          - label: Schrift für Überschriften
            name: heading_font
            widget: select
            options: &fonts
              - { label: "Nunito (freundlich, rund)", value: nunito }
              - { label: "Lora (klassisch, mit Serifen)", value: lora }
              - { label: "Fraunces (warm, mit Serifen)", value: fraunces }
              - { label: "Figtree (klar, modern)", value: figtree }
              - { label: "Systemschrift (schlicht)", value: system }
          - { label: Schrift für Fließtext, name: body_font, widget: select, options: *fonts }
          - label: Logo
            name: logo
            widget: image
            required: false
            hint: "Mit Schriftzug, oben links. Leer lassen, um das Text-Logo zu verwenden."
          - label: Logo, helle Fassung (Fußzeile)
            name: logo_light
            widget: image
            required: false
            hint: "Für den dunklen Hintergrund der Fußzeile. Leer = Name als Text."
          - { label: "Name (klein, oben)", name: site_name_small, widget: string }
          - { label: Name (groß), name: site_name, widget: string }
          - label: Menü
            name: menu
            widget: list
            summary: "{{label}}"
            fields:
              - { label: Text, name: label, widget: string }
              - { label: Link, name: url, widget: string, hint: "z. B. /projekte.html" }
          - label: Spenden-Knopf (oben rechts)
            name: donate_button
            widget: object
            fields:
              - { label: Text, name: label, widget: string }
              - { label: Link, name: url, widget: string }
          - label: Menü (englische Seiten)
            name: menu_en
            widget: list
            summary: "{{label}}"
            fields:
              - { label: Text, name: label, widget: string }
              - { label: Link, name: url, widget: string, hint: "z. B. /en/projects.html" }
          - label: Spenden-Knopf (englische Seiten)
            name: donate_button_en
            widget: object
            fields:
              - { label: Text, name: label, widget: string }
              - { label: Link, name: url, widget: string }
          - label: Kontakt
            name: contact
            widget: object
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Straße, name: street, widget: string }
              - { label: PLZ und Ort, name: city, widget: string }
              - { label: E-Mail, name: email, widget: string }
          - label: Spendenkonto
            name: bank
            widget: object
            fields:
              - { label: Empfänger, name: recipient, widget: string }
              - { label: IBAN, name: iban, widget: string }
              - { label: BIC, name: bic, widget: string }
              - { label: Bank, name: bank_name, widget: string }
              - { label: Verwendungszweck, name: reference, widget: string }
              - { label: Hinweis unter den Kontodaten, name: note, widget: string, required: false }
              - { label: Hinweis unter den Kontodaten (Englisch), name: note_en, widget: string, required: false }
          - label: Kosten der Stiftung (Seite „So können Sie helfen“)
            name: costs
            widget: object
            hint: Beide Zahlen leer = der Kasten erscheint nicht.
            fields:
              - { label: "Fixkosten pro Jahr (Euro)", name: fixed_per_year, widget: number, value_type: float, required: false, hint: "z. B. 428.40 (mit Punkt)" }
              - { label: "Gebühr auf Spenden und Erträge (Prozent)", name: fee_percent, widget: number, value_type: float, required: false, hint: "z. B. 3 – das Beispiel „Bei 100 € Spende …“ wird daraus berechnet." }
              - { label: Erklärung, name: text, widget: text, required: false }
              - { label: Erklärung (Englisch), name: text_en, widget: text, required: false }
          - { label: Hinweis in der Fußzeile, name: footer_note, widget: text, required: false }
          - { label: Hinweis in der Fußzeile (Englisch), name: footer_note_en, widget: text, required: false }

  - name: pages
    label: Startseite
    icon: home
    files:
      - name: home
        label: Startseite
        file: content/_index.md
        fields: &home_fields
          - { label: Titel (intern), name: title, widget: hidden }
          - { label: Beschreibung für Suchmaschinen, name: description, widget: text }
          - label: Kopfbereich
            name: hero
            widget: object
            fields:
              - { label: Kleine Zeile oben, name: kicker, widget: string, required: false }
              - { label: Überschrift, name: headline, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Foto, name: image, widget: image }
              - { label: Bildbeschreibung (für Blinde und Suchmaschinen), name: image_alt, widget: string }
              - label: Knöpfe
                name: buttons
                widget: list
                max: 2
                summary: "{{label}}"
                fields:
                  - { label: Text, name: label, widget: string }
                  - { label: Link, name: url, widget: string }
                  - { label: Hervorgehoben, name: primary, widget: boolean, default: false }
          - label: Leitsatz
            name: mission
            widget: object
            fields:
              - { label: Text, name: text, widget: text }
              - { label: Quelle, name: source, widget: string, required: false }
          - label: Zahlen und Fakten
            name: facts
            widget: list
            max: 4
            summary: "{{value}} – {{label}}"
            fields:
              - { label: Wert, name: value, widget: string }
              - { label: Beschreibung, name: label, widget: string }
          - { label: Überschrift der Kacheln, name: cards_title, widget: string }
          - label: Kacheln
            name: cards
            widget: list
            max: 6
            summary: "{{title}}"
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Foto, name: image, widget: image }
              - { label: Bildbeschreibung, name: image_alt, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Linktext, name: link_label, widget: string, required: false }
              - { label: Link, name: link_url, widget: string, required: false }
          - label: Auszeichnung
            name: award
            widget: object
            required: false
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - label: Bereich „So können Sie helfen“
            name: help
            widget: object
            required: false
            fields:
              - { label: Überschrift, name: title, widget: string }
              - label: Kacheln
                name: tiles
                widget: list
                max: 3
                summary: "{{title}}"
                fields:
                  - { label: Symbol, name: icon, widget: select, options: [{ label: Herz, value: heart }, { label: Geschenk, value: gift }, { label: Menschen, value: people }] }
                  - { label: Titel, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
              - { label: Satz vor den Knöpfen, name: question, widget: string, required: false, hint: "Danach folgen die Knöpfe „Spenden“ und „Kontakt aufnehmen“." }
          - { label: Überschrift „Aus unserer Arbeit“, name: more_title, widget: string }
          - label: Links „Aus unserer Arbeit“
            name: more
            widget: list
            summary: "{{label}}"
            fields:
              - { label: Titel, name: label, widget: string }
              - { label: Link, name: url, widget: string }
              - { label: Kurzbeschreibung, name: text, widget: string, required: false }

  - name: projekte
    label: Projekte
    label_singular: Projekt
    icon: volunteer_activism
    folder: content/projekte
    media_folder: /assets/images
    public_folder: images
    path: "{{slug}}"
    slug: "{{fields.title}}"
    create: true
    i18n: true
    sortable_fields: { fields: [date, title, country], default: { field: date, direction: descending } }
    summary: "{{date | date('MMM YYYY')}} · {{title}} ({{country}})"
    description: >-
      Jedes Projekt erscheint automatisch in der Zeitleiste auf der Projektseite,
      sortiert nach Datum. Das als „Aktuelles Projekt“ markierte Projekt wird auf
      der Startseite, der Projektübersicht und der Spendenseite groß gezeigt.
      Englisch (optional): Titel und Text; ohne englischen Text zeigt die
      englische Seite den deutschen.
    fields:
      - { label: Titel, name: title, widget: string, i18n: true }
      - label: Aktuelles Projekt
        name: current
        widget: boolean
        required: false
        default: false
        hint: "Für dieses Projekt sammeln wir gerade. Nur bei einem Projekt anhaken – sind es mehrere, zählt das neueste."
      - label: Datum (Projektbeginn bzw. letzte Förderung)
        name: date
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
      - { label: Land, name: country, widget: string, hint: "z. B. Nepal" }
      - { label: Hinweis, name: note, widget: string, required: false, hint: "z. B. „Fortführung von September 2022“" }
      - { label: Vorschaubild, name: image, widget: image, required: false, hint: "Für die Projektübersicht. Leer = Fläche mit dem Ländernamen." }
      - label: Berichte und Downloads
        name: downloads
        widget: list
        required: false
        summary: "{{label}}"
        hint: Erscheinen als Kasten oben auf der Projektseite, in dieser Reihenfolge.
        fields:
          - { label: Titel, name: label, widget: string, hint: "z. B. „2. Zwischenbericht“" }
          - label: PDF-Datei
            name: file
            widget: file
            # PDFs are served as they are (no processing) - so static/, not assets/
            media_folder: /static/downloads
            public_folder: /downloads
      - label: Ohne eigene Seite
        name: build
        widget: object
        required: false
        collapsed: true
        hint: "Nur für Einträge in der Zeitleiste ohne eigene Projektseite: render = never."
        fields:
          - { label: Seite erzeugen, name: render, widget: select, options: [always, never], default: always }
        i18n: duplicate
      - { label: Text, name: body, widget: markdown, i18n: true, required: false }

  - name: aktuelles
    label: Aktuelles (Beiträge)
    label_singular: Beitrag
    icon: newspaper
    folder: content/aktuelles
    media_folder: /assets/images
    public_folder: images
    path: "{{slug}}"
    slug: "{{fields.title}}"
    create: true
    i18n: true
    sortable_fields: { fields: [date, title], default: { field: date, direction: descending } }
    summary: "{{date | date('MMM YYYY')}} · {{title}}"
    description: >-
      Jeder Beitrag erscheint als Kachel auf der Seite „Aktuelles“, der neueste
      zuerst, und bekommt eine eigene Seite. Englisch (optional): Titel,
      Kurzfassung, Bildbeschreibung und Text; was fehlt, erscheint auf Deutsch.
    fields:
      - { label: Titel, name: title, widget: string, i18n: true }
      - label: Datum
        name: date
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        hint: Bestimmt die Reihenfolge; angezeigt wird nur das Jahr.
      - { label: Art, name: category, widget: select, options: [Spendenaktion, Veranstaltung, Aus der Stiftung, Projektbericht, Jahresrückblick] }
      - { label: Kurzfassung, name: lead, widget: text, i18n: true, hint: "Ein bis zwei Sätze – steht auf der Kachel und oben im Beitrag." }
      - { label: Foto, name: image, widget: image, required: false, hint: "Leer = farbige Fläche mit der Art des Beitrags." }
      - { label: Bildbeschreibung (für Blinde und Suchmaschinen), name: image_alt, widget: string, required: false, i18n: true }
      - label: Erlös für Projekt
        name: project
        widget: relation
        collection: projekte
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        required: false
        hint: Optional – erscheint als Kasten „Der Erlös ist für dieses Projekt bestimmt“.
      - { label: Text, name: body, widget: markdown, i18n: true, required: false }

  - name: seiten
    label: Weitere Seiten
    icon: description
    files:
      - { name: projekte, label: "Projekte (Einleitung)", file: content/projekte/_index.md, fields: &page_fields [
          { label: Titel, name: title, widget: string },
          { label: Einleitungssatz, name: lead, widget: text, required: false },
          { label: Text, name: body, widget: markdown } ] }
      - { name: vision, label: Unsere Vision, file: content/unsere-vision.md, fields: *page_fields }
      - name: fundraising
        label: Aktuelles
        file: content/fundraising.md
        fields: &news_fields
          - { label: "Titel (Menü, Browser-Tab)", name: title, widget: string }
          - { label: Kleine Zeile oben, name: kicker, widget: string, required: false }
          - { label: Überschrift, name: headline, widget: string, required: false, hint: "Leer = Titel" }
          - { label: Einleitungssatz, name: lead, widget: text, required: false }
          - { label: "Veranstaltungen – Überschrift", name: events_title, widget: string, required: false }
          - label: Bevorstehende Veranstaltungen
            name: events
            widget: list
            required: false
            summary: "{{when}} · {{title}}"
            hint: Vergangene Veranstaltungen hier löschen und als Beitrag unter „Aktuelles (Beiträge)“ anlegen.
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Wann, name: when, widget: string, hint: "z. B. „13. Dezember 2026“ oder „Termin folgt“" }
              - { label: Text, name: text, widget: text, required: false }
              - { label: Linktext, name: link_label, widget: string, required: false }
              - { label: Link, name: link_url, widget: string, required: false }
          - { label: "Beiträge – Überschrift", name: posts_title, widget: string, required: false, hint: "Die Beiträge selbst stehen unter „Aktuelles (Beiträge)“." }
          - { label: "Ältere Meldungen – Überschrift", name: archive_title, widget: string, required: false }
          - { label: Ältere Meldungen, name: body, widget: markdown }
      - name: wir
        label: Über uns
        file: content/wir.md
        fields: &about_fields
          - { label: "Titel (Menü, Browser-Tab)", name: title, widget: string }
          - { label: Kleine Zeile oben, name: kicker, widget: string, required: false }
          - { label: Überschrift, name: headline, widget: string, required: false, hint: "Leer = Titel" }
          - { label: Einleitungssatz, name: lead, widget: text, required: false }
          - label: Abschnitte
            name: sections
            widget: list
            summary: "{{title}}"
            hint: Jeder Abschnitt hat Text und optional ein Foto daneben.
            fields:
              - { label: Überschrift, name: title, widget: string, required: false }
              - { label: Text, name: text, widget: markdown }
              - { label: Foto, name: image, widget: image, required: false }
              - { label: Bildbeschreibung (für Blinde und Suchmaschinen), name: image_alt, widget: string, required: false }
              - { label: Bildunterschrift, name: caption, widget: string, required: false }
              - { label: Fotogröße, name: image_size, widget: select, default: side, options: [{ label: "Schmal neben dem Text", value: side }, { label: "Halbe Breite neben dem Text", value: half }, { label: "Ganze Breite unter dem Text", value: full }] }
              - { label: Foto links, name: image_left, widget: boolean, default: false, hint: "Nur für Fotos neben dem Text." }
              - { label: Hintergrund, name: tone, widget: select, default: plain, options: [{ label: Normal, value: plain }, { label: Farbig hinterlegt, value: band }] }
              - { label: Sprungmarke, name: anchor, widget: string, required: false, hint: "Nur ändern, wenn Sie wissen, wofür: Andere Seiten verlinken diesen Abschnitt damit (z. B. /wir.html#in-erinnerung-an-herbert-schoenebeck)." }
          - label: Knopf am Ende
            name: button
            widget: object
            required: false
            fields:
              - { label: Text, name: label, widget: string }
              - { label: Link, name: url, widget: string }
          - { label: Text am Ende, name: body, widget: markdown, required: false }
      - name: hilfe
        label: So können Sie helfen
        file: content/ihre-hilfe.md
        fields: &help_fields
          - { label: Titel, name: title, widget: string }
          - { label: Kleine Zeile oben, name: kicker, widget: string, required: false }
          - { label: Einleitungssatz, name: lead, widget: text, required: false }
          - { label: "Spenden – kleine Zeile", name: donate_kicker, widget: string, required: false }
          - { label: "Spenden – Überschrift", name: donate_heading, widget: string, required: false }
          - { label: Überschrift über den Kontodaten, name: donate_title, widget: string, hint: "Die Kontodaten selbst kommen aus den Website-Einstellungen." }
          - { label: "„So kommt Ihre Spende an“ – kleine Zeile", name: steps_kicker, widget: string, required: false }
          - { label: "„So kommt Ihre Spende an“ – Überschrift", name: steps_title, widget: string, required: false }
          - label: Schritte
            name: steps
            widget: list
            required: false
            summary: "{{title}}"
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - label: Aufklappbarer Bereich (Spendenbescheinigung)
            name: receipt
            widget: object
            required: false
            fields:
              - { label: Titel (immer sichtbar), name: title, widget: string }
              - { label: Text (aufgeklappt), name: text, widget: markdown }
          - { label: "„Selbst aktiv werden“ – kleine Zeile", name: active_kicker, widget: string, required: false }
          - { label: "„Selbst aktiv werden“ – Überschrift", name: active_title, widget: string, required: false }
          - label: Kacheln
            name: active
            widget: list
            required: false
            summary: "{{title}}"
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Linktext, name: link_label, widget: string, required: false }
              - { label: Link, name: link_url, widget: string, required: false, hint: "z. B. /gregors-40-geburtstag.html" }
          - { label: Frage vor dem Kontakt-Knopf, name: active_question, widget: string, required: false }
          - { label: Text am Ende, name: body, widget: markdown, required: false }
      - { name: kontakt, label: Kontakt, file: content/kontakt.md, fields: *page_fields }
      - { name: impressum, label: Impressum, file: content/impressum.md, fields: *page_fields }
      - { name: datenschutz, label: Datenschutz, file: content/datenschutz.md, fields: *page_fields }
      - { name: reise, label: Nepal-Besuch 2016, file: content/nepal-besuch-2016.md, fields: *page_fields }
      - { name: shree, label: Besuch aus Nepal 2019, file: content/impression-shree.md, fields: *page_fields }

  - name: reise-2016
    label: Nepal-Besuch 2016 (Unterseiten)
    icon: photo_library
    folder: content/reise-2016
    media_folder: /assets/images
    public_folder: images
    create: false
    sortable_fields: { fields: [weight, title], default: { field: weight } }
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Reihenfolge, name: weight, widget: number }
      - { label: Text und Fotos, name: body, widget: markdown }

  - name: english
    label: English pages
    label_singular: English page
    icon: translate
    description: >-
      Die englischen Fassungen der Hauptseiten (Adressen unter /en/). Gleiche
      Felder wie die deutsche Seite. Projekte und Beiträge übersetzen Sie
      direkt beim jeweiligen Eintrag (Umschalter DE/EN). Links auf englische
      Seiten beginnen mit /en/ (z. B. /en/how-to-help.html), Links ohne /en/
      führen zur deutschen Seite. Leere Felder (z. B. keine Veranstaltungen)
      zeigen die deutsche Fassung.
    files:
      - { name: home, label: Home (Startseite), file: content/_index.en.md, fields: *home_fields }
      - { name: about, label: About us (Über uns), file: content/wir.en.md, fields: *about_fields }
      - { name: help, label: How to help (So können Sie helfen), file: content/ihre-hilfe.en.md, fields: *help_fields }
      - { name: projects, label: "Projects (Einleitung der Projektübersicht)", file: content/projekte/_index.en.md, fields: *page_fields }
      - { name: news, label: "News (Aktuelles: Veranstaltungen, ältere Meldungen)", file: content/fundraising.en.md, fields: *news_fields }
      - { name: vision, label: Our vision (Unsere Vision), file: content/unsere-vision.en.md, fields: *page_fields }
      - { name: contact, label: Contact (Kontakt), file: content/kontakt.en.md, fields: *page_fields }
      - { name: legal, label: Legal notice (Impressum), file: content/impressum.en.md, fields: *page_fields }
      - { name: privacy, label: Privacy policy (Datenschutz), file: content/datenschutz.en.md, fields: *page_fields }
