# The real address. CI builds with the address from the GitHub Pages settings
# (--baseURL); builds for any other address get "noindex" (baseof.html), so
# a test address like ne-o.github.io never ends up in search engines.
baseURL = "https://www.zukunft-fuer-kinder.net/"

# Two languages: German at the root, English below /en/. An English page is
# the German file with ".en" before ".md" (wir.md -> wir.en.md); Hugo pairs
# them, so the Deutsch | English switch goes to the matching page. English
# is optional: a project or news post without an English file is listed on
# the English pages in German; one with an English title but no text shows
# the German text (layouts/_partials/translated-content.html).
# Template texts: i18n/de.yaml, i18n/en.yaml.
defaultContentLanguage = "de"
# No /de/ -> / redirect page (with uglyURLs it lands in a stray folder).
disableDefaultLanguageRedirect = true

# Page URLs end in .html (/<slug>.html instead of /<slug>/) - published
# addresses must keep working, see tools/check_links.py.
uglyURLs = true

enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[languages.de]
weight = 1
label = "Deutsch"
locale = "de-DE"
title = "Schönebeck-Stiftung „Zukunft für Kinder“"
[languages.de.params]
description = "Die Schönebeck-Stiftung „Zukunft für Kinder“ fördert seit 2007 Bildung, Gesundheit und Kinderrechte – vor allem in Nepal, gemeinsam mit Plan International."

[languages.en]
weight = 2
label = "English"
locale = "en-GB"
title = "Schönebeck-Stiftung „Zukunft für Kinder“"
[languages.en.params]
description = "Since 2007, the Schönebeck-Stiftung „Zukunft für Kinder“ (Future for Children) has supported education, health and children's rights – mainly in Nepal, together with Plan International."

[params]
production_url = "https://www.zukunft-fuer-kinder.net/"

[imaging]
resampleFilter = "Lanczos"

[markup.goldmark.renderer]
# Editors write Markdown, not HTML.
unsafe = false
# A line break in the editor is a line break on the page.
hardWraps = true

# Projects, news posts and trip report pages are served at the root
# (/<file name>.html) although they live in content subfolders.
[permalinks.page]
projekte = "/:contentbasename"
aktuelles = "/:contentbasename"
reise-2016 = "/:contentbasename"

# Structural settings per page live here, not in the pages' front matter, so
# saving a page in the CMS can never drop them. A target without
# sites.matrix applies to both languages.
[[cascade]]
layout = "kontakt"
[cascade.target]
path = "/kontakt"

[[cascade]]
layout = "ueber-uns"
[cascade.target]
path = "/wir"

[[cascade]]
layout = "spenden"
[cascade.target]
path = "/ihre-hilfe"

[[cascade]]
url = "/projekte.html"
aliases = ["/laufende-und-abgeschlossene-projekte.html"]
[cascade.target]
path = "/projekte"
[cascade.target.sites.matrix]
languages = ["de"]

[[cascade]]
layout = "aktuelles-seite"
[cascade.target]
path = "/fundraising"

[[cascade]]
aliases = ["/wir-auf-amazon-smile.html"]  # removed page, forwards here
[cascade.target]
path = "/fundraising"
[cascade.target.sites.matrix]
languages = ["de"]

[[cascade]]
parent_page = "/nepal-besuch-2016.html"
[cascade.target]
path = "/reise-2016/**"

[[cascade]]
[cascade.build]
render = "never"
[cascade.target]
path = "{/reise-2016,/aktuelles}"
kind = "section"

# English addresses. ("url" is not prefixed with /en/ automatically.) The
# old English addresses (/home-engl.html etc.) forward from static/.
[[cascade]]
url = "/en/about-us.html"
[cascade.target]
path = "/wir"
[cascade.target.sites.matrix]
languages = ["en"]

[[cascade]]
url = "/en/how-to-help.html"
[cascade.target]
path = "/ihre-hilfe"
[cascade.target.sites.matrix]
languages = ["en"]

[[cascade]]
url = "/en/projects.html"
[cascade.target]
path = "/projekte"
[cascade.target.sites.matrix]
languages = ["en"]

[[cascade]]
url = "/en/news.html"
[cascade.target]
path = "/fundraising"
[cascade.target.sites.matrix]
languages = ["en"]

[[cascade]]
url = "/en/vision.html"
[cascade.target]
path = "/unsere-vision"
[cascade.target.sites.matrix]
languages = ["en"]

[[cascade]]
url = "/en/contact.html"
[cascade.target]
path = "/kontakt"
[cascade.target.sites.matrix]
languages = ["en"]

[[cascade]]
url = "/en/legal-notice.html"
[cascade.target]
path = "/impressum"
[cascade.target.sites.matrix]
languages = ["en"]

[[cascade]]
url = "/en/privacy.html"
[cascade.target]
path = "/datenschutz"
[cascade.target.sites.matrix]
languages = ["en"]
